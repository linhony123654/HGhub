name: Android APK (Manual)

# 手动单点触发构建安卓 APK，无需在本机安装 Rust / Android NDK。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 目标 ABI（aarch64 覆盖绝大多数现代安卓手机且构建最快）
        required: true
        type: choice
        default: aarch64
        options:
          - aarch64
          - all
      build_type:
        description: 构建类型
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android APK (${{ inputs.target }} · ${{ inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取应用版本
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target == 'all' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || 'aarch64-linux-android' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-apk-${{ inputs.target }}-${{ inputs.build_type }}

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'package.json') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 Android APK
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--apk --split-per-abi)
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ARGS+=(--debug)
          fi
          if [ "${{ inputs.target }}" = "all" ]; then
            ARGS+=(--target aarch64 armv7 x86_64)
          else
            ARGS+=(--target aarch64)
          fi
          pnpm tauri android build "${ARGS[@]}"

      - name: 签名并收集 APK 产物
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_TYPE: ${{ inputs.build_type }}
          TARGET_INPUT: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          found=0

          if [ "$BUILD_TYPE" = "debug" ]; then
            for f in $(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk'); do
              abi="$(basename "$(dirname "$(dirname "$f")")")"
              [ "$abi" = "apk" ] && abi="$TARGET_INPUT"
              out="artifacts/HGhub_${VERSION}_${abi}_debug.apk"
              cp "$f" "$out"
              "$APKSIGNER" verify --print-certs "$out" | head -3
              found=$((found + 1))
            done
            SIGN_MODE="Gradle Debug Keystore"
          else
            KS="$RUNNER_TEMP/android-apk.keystore"
            if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
              ALIAS="$KEY_ALIAS"
              SPASS="$STORE_PASSWORD"
              KPASS="$KEY_PASSWORD"
              SUFFIX=""
              SIGN_MODE="Repository Signing Secret"
            else
              PASS="hghub-ephemeral-$(date +%s)"
              keytool -genkeypair -v \
                -keystore "$KS" -storetype PKCS12 \
                -alias hghub-dev -keyalg RSA -keysize 2048 -validity 3650 \
                -storepass "$PASS" -keypass "$PASS" \
                -dname "CN=HGhub Dev, O=HGhub, C=CN"
              ALIAS="hghub-dev"
              SPASS="$PASS"
              KPASS="$PASS"
              SUFFIX="_selfsigned"
              SIGN_MODE="Ephemeral Self-Signed Keystore (测试安装用；覆盖安装正式版需先卸载或配置 Secrets)"
            fi

            for f in $(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release*.apk'); do
              abi="$(basename "$(dirname "$(dirname "$f")")")"
              [ "$abi" = "apk" ] && abi="$TARGET_INPUT"
              out="artifacts/HGhub_${VERSION}_${abi}${SUFFIX}.apk"
              "$APKSIGNER" sign \
                --ks "$KS" --ks-key-alias "$ALIAS" \
                --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" \
                --v4-signing-enabled false \
                --out "$out" "$f"
              "$APKSIGNER" verify --print-certs "$out" | head -3
              found=$((found + 1))
            done
            rm -f "$KS"
          fi

          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到 ${BUILD_TYPE} APK"
            exit 1
          fi

          ls -lh artifacts
          {
            echo "### Android APK 构建完成"
            echo "- 版本: \`${VERSION}\`"
            echo "- 构建类型: \`${BUILD_TYPE}\`"
            echo "- 目标 ABI: \`${TARGET_INPUT}\`"
            echo "- 签名方式: ${SIGN_MODE}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for a in artifacts/*.apk; do
              echo "| \`$(basename "$a")\` | $(du -h "$a" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: hghub-android-${{ inputs.target }}-${{ inputs.build_type }}
          path: artifacts/*.apk
          retention-days: 14
          if-no-files-found: error
